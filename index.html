    <style>
        :root {
            --bg-void: #040509;
            --bg-deep: #0a0d16;
            --surface: #12151f;
            --surface-2: #171b28;
            --edge: rgba(255, 255, 255, 0.07);
            --edge-bright: rgba(212, 175, 106, 0.4);
            --gold: #d4af6a;
            --gold-bright: #f4d999;
            --gold-dim: #8a6a3a;
            --green: #34d399;
            --green-bg: rgba(52, 211, 153, 0.1);
            --green-bd: rgba(52, 211, 153, 0.35);
            --ink: #f4f2ec;
            --ink-dim: #9aa0ae;
            --ink-faint: #5c6272;
            --shadow-deep:
                0 40px 90px -25px rgba(0, 0, 0, 0.85),
                0 12px 32px rgba(0, 0, 0, 0.55);
            --section-gap: 16px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: "Inter", sans-serif;
            background: var(--bg-void);
            color: var(--ink);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* ── Ambient dark backdrop: grid + drifting glow spheres ── */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(var(--edge) 1px, transparent 1px),
                linear-gradient(90deg, var(--edge) 1px, transparent 1px);
            background-size: 42px 42px;
            -webkit-mask-image: radial-gradient(ellipse 65% 55% at 50% 40%, #000 0%, transparent 75%);
            mask-image: radial-gradient(ellipse 65% 55% at 50% 40%, #000 0%, transparent 75%);
            opacity: 0.55;
        }

        .dl3d-orb-field {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .dl3d-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.35;
            animation: dl3d-drift 16s ease-in-out infinite;
        }

        .dl3d-orb-a {
            width: 320px;
            height: 320px;
            left: -80px;
            top: -60px;
            background: radial-gradient(circle, var(--gold-dim), transparent 70%);
        }

        .dl3d-orb-b {
            width: 280px;
            height: 280px;
            right: -70px;
            bottom: -40px;
            background: radial-gradient(circle, var(--green), transparent 70%);
            animation-delay: -8s;
        }

        @keyframes dl3d-drift {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(24px, -18px) scale(1.08);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .dl3d-orb,
            .dl3d-badge::before,
            .dl3d-live-dot,
            .dl3d-ring-track,
            .dl3d-ring-sat,
            .dl3d-cta-btn {
                animation: none !important;
            }
        }

        /* ── 3D stage: gives the card real perspective for the tilt ── */
        .dl3d-stage {
            position: relative;
            z-index: 1;
            perspective: 1400px;
        }

        /* ── Card ── */
        .dl3d-card {
            position: relative;
            background: linear-gradient(180deg, var(--surface) 0%, var(--bg-deep) 100%);
            border: 1px solid var(--edge);
            border-radius: 20px;
            box-shadow: var(--shadow-deep);
            width: min(440px, calc(100vw - 32px));
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transform-style: preserve-3d;
            will-change: transform;
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            margin-top: 10px;
        }

        /* thin luminous top edge, like a beveled instrument panel */
        .dl3d-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-bright), var(--green), transparent);
            opacity: 0.6;
            z-index: 2;
        }

        /* ── Telegram / channel notice ── */
        .dl3d-notice {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 20px;
            border-bottom: 1px solid var(--edge);
            background: rgba(255, 255, 255, 0.02);
            font-family: "JetBrains Mono", monospace;
            font-size: 10.5px;
            color: var(--ink-faint);
            letter-spacing: 0.06em;
            flex-shrink: 0;
        }

        .dl3d-notice strong {
            color: var(--ink-dim);
            font-weight: 500;
        }

        .dl3d-notice a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 500;
        }

        .dl3d-notice a:hover {
            text-decoration: underline;
        }

        /* ── Body ── */
        .dl3d-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 32px var(--section-gap);
            gap: var(--section-gap);
            transform: translateZ(24px);
        }

        /* ── Identity + Signal Orb (signature element) ── */
        .dl3d-identity {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            text-align: center;
            width: 100%;
        }

        .dl3d-orbit {
            position: relative;
            width: 128px;
            height: 128px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .dl3d-ring-track {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from 0deg,
                    var(--gold) 0deg,
                    transparent 60deg,
                    transparent 300deg,
                    var(--green) 360deg);
            animation: dl3d-spin 7s linear infinite;
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
        }

        @keyframes dl3d-spin {
            to {
                transform: rotate(360deg);
            }
        }

        .dl3d-ring-sat {
            position: absolute;
            inset: 0;
            animation: dl3d-spin 7s linear infinite;
        }

        .dl3d-ring-sat::after {
            content: "";
            position: absolute;
            top: -3px;
            left: 50%;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--gold-bright);
            box-shadow: 0 0 10px 2px var(--gold-bright);
            transform: translateX(-50%);
        }

        .dl3d-logo-ring {
            position: relative;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, var(--gold-dim), var(--gold-bright) 50%, var(--gold-dim));
            box-shadow:
                0 10px 26px rgba(0, 0, 0, 0.6),
                0 0 0 6px rgba(212, 175, 106, 0.06);
        }

        .dl3d-logo-ring img {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--bg-deep);
        }

        .dl3d-name {
            font-family: "Bricolage Grotesque", serif;
            font-size: clamp(26px, 6.2vw, 36px);
            font-weight: 700;
            color: var(--ink);
            letter-spacing: -0.01em;
            line-height: 1.15;
        }

        .dl3d-trader-name {
            font-family: "JetBrains Mono", monospace;
            font-size: 11.5px;
            color: var(--ink-faint);
            letter-spacing: 0.14em;
            text-transform: uppercase;
            font-weight: 400;
            margin-top: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .dl3d-badge {
            display: inline-flex;
            align-items: center;
            flex-shrink: 0;
            max-width: 100%;
            box-sizing: border-box;
            gap: 6px;
            background: var(--green-bg);
            border: 1px solid var(--green-bd);
            border-radius: 100px;
            padding: 5px 13px;
            font-size: 12px;
            color: var(--green);
            font-weight: 500;
            letter-spacing: 0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            position: relative;
        }

        .dl3d-badge::before {
            content: "";
            position: absolute;
            top: 0;
            left: -75%;
            width: 50%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            animation: dl3d-shine 2.5s infinite;
        }

        @keyframes dl3d-shine {
            0% {
                left: -75%;
            }

            100% {
                left: 125%;
            }
        }

        .dl3d-live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            animation: dl3d-blink 2.2s ease-in-out infinite;
        }

        @keyframes dl3d-blink {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.45;
                transform: scale(1.4);
            }
        }

        /* ── Divider ── */
        .dl3d-divider {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .dl3d-divider::before,
        .dl3d-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--edge);
        }

        .dl3d-divider-label {
            font-family: "JetBrains Mono", monospace;
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--gold);
            font-weight: 500;
            white-space: nowrap;
        }

        /* ── Features, styled as beveled instrument-panel rows ── */
        .dl3d-features {
            display: flex;
            flex-direction: column;
            gap: 9px;
            width: 100%;
        }

        .dl3d-feature {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            background: linear-gradient(180deg, var(--surface-2), var(--surface));
            border: 1px solid var(--edge);
            border-radius: 12px;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
            width: 100%;
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 6px 14px rgba(0, 0, 0, 0.35);
        }

        .dl3d-feature:hover {
            border-color: var(--edge-bright);
            transform: translateY(-2px) translateZ(6px);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.5);
        }

        .dl3d-feature-icon {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: linear-gradient(145deg, var(--surface-2), var(--bg-deep));
            border: 1px solid var(--edge);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 13px;
            color: var(--gold);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                0 3px 8px rgba(0, 0, 0, 0.5);
        }

        .dl3d-feature-content {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .dl3d-feature-content span {
            font-size: 13.5px;
            color: var(--ink-dim);
            line-height: 1.45;
        }

        /* ── CTA block ── */
        .dl3d-cta-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: var(--section-gap) 32px 26px;
            flex-shrink: 0;
            transform: translateZ(24px);
        }

        .dl3d-cta-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            width: 100%;
            padding: 16px 20px;
            font-size: 16px;
            background: linear-gradient(180deg, var(--gold-bright), var(--gold) 60%, var(--gold-dim));
            color: #1a1206;
            border-radius: 10px;
            text-decoration: none;
            font-family: "Inter", sans-serif;
            font-weight: 600;
            letter-spacing: 0.01em;
            cursor: pointer;
            box-shadow:
                0 1px 0 rgba(255, 255, 255, 0.5) inset,
                0 10px 26px -6px rgba(212, 175, 106, 0.55);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            animation: dl3d-pulseGold 2.4s infinite;
        }

        .dl3d-cta-btn:hover {
            transform: translateY(-2px);
            box-shadow:
                0 1px 0 rgba(255, 255, 255, 0.5) inset,
                0 16px 34px -6px rgba(212, 175, 106, 0.7);
        }

        .dl3d-cta-btn:active {
            transform: translateY(0);
        }

        @keyframes dl3d-pulseGold {
            0% {
                box-shadow: 0 1px 0 rgba(255, 255, 255, 0.5) inset, 0 0 0 0 rgba(212, 175, 106, 0.45);
            }

            70% {
                box-shadow: 0 1px 0 rgba(255, 255, 255, 0.5) inset, 0 0 0 14px rgba(212, 175, 106, 0);
            }

            100% {
                box-shadow: 0 1px 0 rgba(255, 255, 255, 0.5) inset, 0 0 0 0 rgba(212, 175, 106, 0);
            }
        }

        /* ── Platform brand variants ── */
        .dl3d-cta-btn.dl3d-cta-whatsapp {
            background: linear-gradient(180deg, #3fe08c, #25d366 55%, #1aa851);
            color: #06210f;
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.4) inset, 0 10px 26px -6px rgba(37, 211, 102, 0.55);
            animation: dl3d-pulseWa 2.4s infinite;
        }

        @keyframes dl3d-pulseWa {
            0% {
                box-shadow: 0 1px 0 rgba(255, 255, 255, 0.4) inset, 0 0 0 0 rgba(37, 211, 102, 0.5);
            }

            70% {
                box-shadow: 0 1px 0 rgba(255, 255, 255, 0.4) inset, 0 0 0 14px rgba(37, 211, 102, 0);
            }

            100% {
                box-shadow: 0 1px 0 rgba(255, 255, 255, 0.4) inset, 0 0 0 0 rgba(37, 211, 102, 0);
            }
        }

        .dl3d-cta-btn.dl3d-cta-facebook {
            background: linear-gradient(180deg, #5b9bf8, #1877f2 55%, #0f5fd1);
            color: #ffffff;
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.35) inset, 0 10px 26px -6px rgba(24, 119, 242, 0.55);
            animation: dl3d-pulseFb 2.4s infinite;
        }

        @keyframes dl3d-pulseFb {
            0% {
                box-shadow: 0 1px 0 rgba(255, 255, 255, 0.35) inset, 0 0 0 0 rgba(24, 119, 242, 0.5);
            }

            70% {
                box-shadow: 0 1px 0 rgba(255, 255, 255, 0.35) inset, 0 0 0 14px rgba(24, 119, 242, 0);
            }

            100% {
                box-shadow: 0 1px 0 rgba(255, 255, 255, 0.35) inset, 0 0 0 0 rgba(24, 119, 242, 0);
            }
        }

        .dl3d-cta-btn.dl3d-cta-instagram {
            background: linear-gradient(135deg, #4f5bd5, #962fbf 30%, #d62976 55%, #fa7e1e 80%, #feda75 100%);
            color: #ffffff;
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.35) inset, 0 10px 26px -6px rgba(214, 41, 118, 0.55);
            animation: dl3d-pulseIg 2.4s infinite;
        }

        @keyframes dl3d-pulseIg {
            0% {
                box-shadow: 0 1px 0 rgba(255, 255, 255, 0.35) inset, 0 0 0 0 rgba(214, 41, 118, 0.5);
            }

            70% {
                box-shadow: 0 1px 0 rgba(255, 255, 255, 0.35) inset, 0 0 0 14px rgba(214, 41, 118, 0);
            }

            100% {
                box-shadow: 0 1px 0 rgba(255, 255, 255, 0.35) inset, 0 0 0 0 rgba(214, 41, 118, 0);
            }
        }

        .dl3d-cta-btn.dl3d-cta-link {
            background: linear-gradient(180deg, #6cc9f2, #229ed9 55%, #1580ae);
            color: #ffffff;
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.35) inset, 0 10px 26px -6px rgba(34, 158, 217, 0.55);
            animation: dl3d-pulseTg 2.4s infinite;
        }

        @keyframes dl3d-pulseTg {
            0% {
                box-shadow: 0 1px 0 rgba(255, 255, 255, 0.35) inset, 0 0 0 0 rgba(34, 158, 217, 0.5);
            }

            70% {
                box-shadow: 0 1px 0 rgba(255, 255, 255, 0.35) inset, 0 0 0 14px rgba(34, 158, 217, 0);
            }

            100% {
                box-shadow: 0 1px 0 rgba(255, 255, 255, 0.35) inset, 0 0 0 0 rgba(34, 158, 217, 0);
            }
        }

        .dl3d-cta-btn.dl3d-cta-link {
            background: linear-gradient(180deg,#ffb347,#ff7b00 55%,#e85d04);;
            color: #fff;
            box-shadow: 0 2px 0 rgba(255, 255, 255, .35) inset, 0 12px 30px rgba(255, 184, 0, .45);
            animation: dl3d-pulseGold 2s infinite;
        }

        @keyframes dl3d-pulseGold {
            0% {
                box-shadow: 0 1px 0 rgba(255, 255, 255, 0.35) inset, 0 0 0 0 rgba(34, 158, 217, 0.5);
            }

            70% {
                box-shadow: 0 1px 0 rgba(255, 255, 255, 0.35) inset, 0 0 0 14px rgba(34, 158, 217, 0);
            }

            100% {
                box-shadow: 0 1px 0 rgba(255, 255, 255, 0.35) inset, 0 0 0 0 rgba(34, 158, 217, 0);
            }
        }

        .dl3d-cta-sub {
            font-size: 11.5px;
            color: var(--ink-faint);
            letter-spacing: 0.02em;
            font-weight: 400;
        }

        .dl3d-cta-sub a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 500;
        }

        .dl3d-cta-sub a:hover {
            text-decoration: underline;
        }

        /* ── Footer ── */
        .dl3d-footer {
            border-top: 1px solid var(--edge);
            padding: 12px 24px 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            background: rgba(255, 255, 255, 0.015);
            flex-shrink: 0;
        }

        .dl3d-footer-ads {
            font-family: "JetBrains Mono", monospace;
            font-size: 10.5px;
            color: var(--ink-faint);
            letter-spacing: 0.06em;
            text-align: center;
            font-weight: 400;
        }

        .dl3d-disclaimer {
            font-size: 10.5px;
            color: var(--ink-faint);
            text-align: center;
            line-height: 1.6;
            font-weight: 300;
            opacity: 0.8;
        }

        .dl3d-disclaimer strong {
            font-weight: 500;
            color: var(--ink-dim);
        }

        /* ── Entrance animations ── */
        @keyframes dl3d-fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dl3d-a3 {
            animation: dl3d-fadeUp 0.5s 0.1s ease both;
        }

        .dl3d-a4 {
            animation: dl3d-fadeUp 0.5s 0.2s ease both;
        }

        .dl3d-a5 {
            animation: dl3d-fadeUp 0.5s 0.3s ease both;
        }

        .dl3d-a7 {
            animation: dl3d-fadeUp 0.5s 0.4s ease both;
        }

        /* ── Desktop ── */
        @media (min-width: 540px) {
            body {
                padding: 40px 20px;
            }

            .dl3d-card {
                border-radius: 22px;
            }

            .dl3d-body {
                padding: 34px 40px var(--section-gap);
            }

            .dl3d-cta-block {
                padding: var(--section-gap) 40px 26px;
            }
        }

        /* ── Mobile ── */
        @media (max-width: 539px) {
            body {
                padding: 0 !important;
                justify-content: center;
                align-items: center;
            }

            .dl3d-stage {
                perspective: none;
            }

            .dl3d-card {
                /*width: 100%;*/
                min-height: 100dvh;
                border-radius: 0;
                border: none;
                box-shadow: none;
                justify-content: flex-start;
                transform: none !important;
            }

            .dl3d-orbit {
                width: 108px;
                height: 108px;
            }

            .dl3d-logo-ring {
                width: 84px;
                height: 84px;
            }
        }
    </style>
</head>

<body>
    <div class="dl3d-orb-field">
        <div class="dl3d-orb dl3d-orb-a"></div>

        // Subtle pointer-driven 3D tilt on desktop only; respects reduced-motion and touch devices.
        (function() {
            var dl3dCard = document.getElementById("dl3d-tiltCard");
            var dl3dStage = dl3dCard.parentElement;
            var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            var isTouch = window.matchMedia("(pointer: coarse)").matches;
            if (reduceMotion || isTouch) return;

            var maxTilt = 6;

            dl3dStage.addEventListener("mousemove", function(e) {
                var rect = dl3dStage.getBoundingClientRect();
                var x = (e.clientX - rect.left) / rect.width - 0.5;
                var y = (e.clientY - rect.top) / rect.height - 0.5;
                dl3dCard.style.transform =
                    "rotateY(" + (x * maxTilt) + "deg) rotateX(" + (-y * maxTilt) + "deg)";
            });

            dl3dStage.addEventListener("mouseleave", function() {
                dl3dCard.style.transform = "rotateY(0deg) rotateX(0deg)";
            });
        })();
    </script>
