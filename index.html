            margin: 0;
            padding: 0;

        body {

            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;

        /* Ambient light backdrop grid */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(212, 175, 106, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(212, 175, 106, 0.15) 1px, transparent 1px);
            background-size: 42px 42px;
            -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 0%, transparent 80%);

            opacity: 0.8;

        .dl3d-orb-field {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;

        .dl3d-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.4;
            animation: dl3d-drift 16s ease-in-out infinite;

            height: 350px;
            left: -100px;
            top: -80px;
            background: radial-gradient(circle, var(--gold-bright), transparent 70%);

        .dl3d-orb-b {
            width: 300px;
            height: 300px;
            right: -80px;
            bottom: -60px;
            background: radial-gradient(circle, #fcfcfc, transparent 70%);
            animation-delay: -8s;
        }

        @keyframes dl3d-drift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -20px) scale(1.05); }
        }

        @media (prefers-reduced-motion: reduce) {
            .dl3d-orb, .dl3d-badge::before, .dl3d-live-dot, .dl3d-ring-track, .dl3d-ring-sat, .dl3d-cta-btn {

            border: 1px solid var(--edge);
            border-radius: 20px;
            box-shadow: var(--shadow-deep);
            width: min(440px, calc(100vw - 32px));
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transform-style: preserve-3d;

            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);

            top: 0;
            left: 0;
            right: 0;

            justify-content: center;
            flex-shrink: 0;

        .dl3d-ring-track {

        // 3D Tilt Effect (Desktop only, respects touch/motion settings)
        (function() {
            var dl3dCard = document.getElementById("dl3d-tiltCard");
            var dl3dStage = dl3dCard.parentElement;
            var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            var isTouch = window.matchMedia("(pointer: coarse)").matches;
            if (reduceMotion || isTouch) return;

            var maxTilt = 8;
            dl3dStage.addEventListener("mousemove", function(e) {
                var rect = dl3dStage.getBoundingClientRect();
                var x = (e.clientX - rect.left) / rect.width - 0.5;
                var y = (e.clientY - rect.top) / rect.height - 0.5;
                dl3dCard.style.transform = "rotateY(" + (x * maxTilt) + "deg) rotateX(" + (-y * maxTilt) + "deg)";
            });

            dl3dStage.addEventListener("mouseleave", function() {
                dl3dCard.style.transform = "rotateY(0deg) rotateX(0deg)";
            });
        })();
    </script>
